[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jtl-mcp-server"
version = "0.1.0"
description = "Read-only MCP-Server fuer JTL-Wawi (Streamable HTTP, LiteLLM-kompatibel)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Volker Grabbe" }]
keywords = ["mcp", "jtl-wawi", "fastmcp", "litellm", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "fastmcp>=2.12,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
jtl-mcp-server = "jtl_mcp.server:main"

[project.urls]
Homepage = "https://github.com/volkergrabbe/jtl-mcp-server"
Issues = "https://github.com/volkergrabbe/jtl-mcp-server/issues"
Documentation = "https://developer.jtl-software.com/products/erpapi/openapi/"

[tool.hatch.build.targets.wheel]
packages = ["src/jtl_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
